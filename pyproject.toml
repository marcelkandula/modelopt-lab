[project]
name = "modelopt-lab"
version = "0.1.0"
description = "Quantization, deployment and speculative decoding of Qwen3-8B with NVIDIA Model Optimizer on one RTX A6000"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # cu129 builds (see tool.uv.sources): driver 575 supports CUDA <= 12.9
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",  # vLLM dep; the PyPI build needs CUDA 13
    "vllm==0.30.0",  # 0.32 conflicts with ModelOpt's transformers pin
    "nvidia-modelopt[hf]==0.47.0",
    "transformers>=5.10.4,<5.15",  # vLLM 0.30 needs >=5.10.4, ModelOpt 0.47 <5.15
    "accelerate",
    "datasets",
    "lm-eval[hf,api]>=0.4.13",
    "matplotlib",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
